    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(fn) { _fetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return _fetch; },
                set: function(fn) { _fetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (err) {}
      })();
    </script>
